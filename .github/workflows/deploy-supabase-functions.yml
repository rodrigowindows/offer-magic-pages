name: Deploy Supabase (Migrations + Edge Functions)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/functions/**'
      - '.github/workflows/deploy-supabase-functions.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate required secrets and resolve project ref
        id: resolve
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_ACCESS_TOKEN:-}" ]; then
            echo "::error::Missing required secret: SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          if [ -z "${SUPABASE_DB_PASSWORD:-}" ]; then
            echo "::error::Missing required secret: SUPABASE_DB_PASSWORD"
            exit 1
          fi

          PROJECT_REF="${SUPABASE_PROJECT_REF:-}"

          if [ -z "$PROJECT_REF" ] && [ -f "supabase/config.toml" ]; then
            PROJECT_REF="$(awk -F'\"' '/^project_id[[:space:]]*=/ {print $2; exit}' supabase/config.toml)"
          fi

          if [ -z "$PROJECT_REF" ]; then
            echo "::error::Missing Supabase project ref. Configure SUPABASE_PROJECT_REF secret or project_id in supabase/config.toml."
            exit 1
          fi

          echo "project_ref=$PROJECT_REF" >> "$GITHUB_OUTPUT"

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project
        run: |
          set -euo pipefail
          supabase link --project-ref "${{ steps.resolve.outputs.project_ref }}" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: |
          set -euo pipefail
          supabase db push --project-ref "${{ steps.resolve.outputs.project_ref }}" --password "$SUPABASE_DB_PASSWORD" --include-all

      - name: Deploy all Edge Functions
        id: deploy_functions
        run: |
          set -euo pipefail

          if [ ! -d "supabase/functions" ]; then
            echo "::error::Directory supabase/functions not found"
            exit 1
          fi

          mapfile -t FUNCTIONS < <(find supabase/functions -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | sort)
          DEPLOYED_COUNT=0

          for fn in "${FUNCTIONS[@]}"; do
            if [ "$fn" = "_shared" ]; then
              continue
            fi

            if [ ! -f "supabase/functions/$fn/index.ts" ] && [ ! -f "supabase/functions/$fn/index.js" ]; then
              echo "::warning::Skipping '$fn' because index.ts/index.js was not found"
              continue
            fi

            echo "Deploying function: $fn"
            supabase functions deploy "$fn" --project-ref "${{ steps.resolve.outputs.project_ref }}"
            DEPLOYED_COUNT=$((DEPLOYED_COUNT + 1))
          done

          if [ "$DEPLOYED_COUNT" -eq 0 ]; then
            echo "::error::No deployable edge functions found under supabase/functions"
            exit 1
          fi

          echo "deployed_count=$DEPLOYED_COUNT" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        run: |
          echo "Supabase deployment finished successfully"
          echo "Project: ${{ steps.resolve.outputs.project_ref }}"
          echo "Migrations: applied with supabase db push --include-all"
          echo "Functions deployed: ${{ steps.deploy_functions.outputs.deployed_count }}"
