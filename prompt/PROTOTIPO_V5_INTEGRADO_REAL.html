<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow V5 - Integração Código Real</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --success: #16a34a;
      --warning: #ca8a04;
      --bg: #f1f5f9;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--primary); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar - Fila de Trabalho */
    .sidebar { width: 350px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: #f8fafc; }
    .property-list { flex-grow: 1; overflow-y: auto; padding: 15px; }
    .prop-card { background: #fff; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; cursor: pointer; transition: 0.2s; overflow: hidden; }
    .prop-card.active { border: 2px solid var(--accent); background: #eff6ff; }
    .prop-img { width: 100%; height: 80px; object-fit: cover; }
    .prop-info { padding: 10px; }

    /* Main Area */
    .main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    .wizard-nav { background: #fff; padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: center; gap: 8px; }
    .step-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #94a3b8; padding: 6px 12px; border-radius: 8px; }
    .step-dot.active { background: #eff6ff; color: var(--accent); }
    .step-dot.done { color: var(--success); }

    /* Workspace */
    .workspace { flex-grow: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
    .content-container { width: 100%; max-width: 1000px; background: #fff; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.05); min-height: 600px; display: flex; flex-direction: column; }
    .content-body { padding: 30px; flex-grow: 1; }
    .content-footer { padding: 20px 30px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border-radius: 0 0 16px 16px; }

    /* Componentes Reais do Código (Step 4) */
    .insights-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
    .insight-card { padding: 15px; border-radius: 10px; border: 1px solid var(--border); background: #f8fafc; }
    .insight-val { font-size: 18px; font-weight: 900; display: block; }
    .insight-label { font-size: 10px; color: #64748b; text-transform: uppercase; }

    .source-pill { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #e2e8f0; font-weight: 700; }
    .similarity-badge { font-size: 10px; padding: 2px 6px; border-radius: 4px; background: #dcfce7; color: #166534; font-weight: 800; }

    /* Passo 5 - Calculadora Pro */
    .offer-box { background: #0f172a; color: #fff; padding: 30px; border-radius: 16px; margin-top: 20px; }
    .offer-row { display: flex; justify-content: space-between; margin-bottom: 12px; font-size: 14px; }
    .offer-total { font-size: 32px; font-weight: 900; color: var(--success); border-top: 1px solid #334155; margin-top: 20px; padding-top: 20px; }

    .btn-primary { background: var(--accent); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-outline { padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: #fff; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 style="font-size: 16px;">Workflow de Aquisição</h2>
      <p style="font-size: 11px; color: #64748b;">Integração: CompsAnalysis.tsx v2.0</p>
    </div>
    <div class="property-list" id="propList"></div>
  </aside>

  <main class="main">
    <nav class="wizard-nav">
      <div class="step-dot" id="dot1">1. BASE</div>
      <div class="step-dot" id="dot2">2. ANÁLISE</div>
      <div class="step-dot" id="dot3">3. SKIP TRACE</div>
      <div class="step-dot" id="dot4">4. MERCADO</div>
      <div class="step-dot" id="dot5">5. OFERTA</div>
    </nav>

    <div class="workspace">
      <div class="content-container">
        <div class="content-body" id="stepContent"></div>
        <div class="content-footer">
          <button class="btn-outline" onclick="moveStep(-1)" id="backBtn">Voltar</button>
          <div id="stepInfo" style="font-size: 12px; font-weight: 700; color: #64748b;">PASSO 4 DE 5</div>
          <button class="btn-primary" onclick="moveStep(1)" id="nextBtn">Avançar →</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const properties = [
      { id: 1, address: "114 W Celeste St", city: "Orlando", sqft: 1420, avm: 295000, img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=400" }
    ];

    let currentStep = 4; // Começamos no Passo 4 para mostrar a integração
    let selectedId = 1;

    function renderContent() {
      const body = document.getElementById('stepContent');
      const prop = properties[0];
      
      for(let i=1; i<=5; i++) {
        const dot = document.getElementById('dot'+i);
        dot.className = 'step-dot ' + (i < currentStep ? 'done' : i === currentStep ? 'active' : '');
      }

      document.getElementById('stepInfo').innerText = `PASSO ${currentStep} DE 5`;

      if(currentStep === 4) {
        body.innerHTML = `
          <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h3>Passo 4: Comparativos (Executive Summary)</h3>
            <span class="source-pill">Fonte: Attom V2 + Manual</span>
          </div>
          
          <div class="insights-bar">
            <div class="insight-card">
              <span class="insight-label">Market Heat</span>
              <span class="insight-val" style="color:var(--success);">HOT 🔥</span>
            </div>
            <div class="insight-card">
              <span class="insight-label">Média $/sqft</span>
              <span class="insight-val">$204.80</span>
            </div>
            <div class="insight-card">
              <span class="insight-label">Estimativa AVM</span>
              <span class="insight-val">$291,100</span>
            </div>
          </div>

          <p style="font-size: 12px; color: #64748b; margin-bottom: 15px;">Smart Insights: Fast-moving market - Act quickly. Based on 12 comparables.</p>

          <table style="width:100%; border-collapse: collapse; font-size: 12px;">
            <thead>
              <tr style="text-align: left; color: #64748b; border-bottom: 1px solid var(--border);">
                <th style="padding: 10px;">Endereço Comp</th>
                <th>Preço</th>
                <th>Sqft</th>
                <th>$/sqft</th>
                <th>Similarity</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td style="padding: 12px 10px;">12 Oak Ave (Manual)</td>
                <td>$280,000</td>
                <td>1,400</td>
                <td>$200.00</td>
                <td><span class="similarity-badge">92%</span></td>
              </tr>
              <tr>
                <td style="padding: 12px 10px;">18 Pine Dr (Attom)</td>
                <td>$310,000</td>
                <td>1,500</td>
                <td>$206.66</td>
                <td><span class="similarity-badge">88%</span></td>
              </tr>
            </tbody>
          </table>
          
          <div style="margin-top: 20px; text-align: right;">
            <button class="btn-outline" style="font-size: 11px;">+ Adicionar Comp Manual</button>
            <button class="btn-outline" style="font-size: 11px; margin-left: 8px;">Recalcular AVM</button>
          </div>
        `;
      } else if (currentStep === 5) {
        const avgSqft = 204.80;
        const arv = 291100;
        const repairs = 71000;
        const margin = 23200;
        const maxOffer = arv - repairs - margin;

        body.innerHTML = `
          <h3>Passo 5: Proposta e Oferta Final</h3>
          <p class="subtitle">Resultado final da análise técnica para aprovação comercial.</p>
          
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 20px;">
            <div style="border: 1px solid var(--border); padding: 20px; border-radius: 12px;">
              <p style="font-size: 11px; font-weight: 700; color: #64748b;">DADOS DA PROPRIEDADE</p>
              <div style="margin-top: 10px;">
                <p><b>Address:</b> ${prop.address}</p>
                <p><b>Square Feet:</b> ${prop.sqft}</p>
                <p><b>Owner:</b> Sarah Jackson Estate</p>
              </div>
            </div>
            <div style="border: 1px solid var(--border); padding: 20px; border-radius: 12px; background: #f0fdf4;">
              <p style="font-size: 11px; font-weight: 700; color: #166534;">DADOS DO MERCADO (P4)</p>
              <div style="margin-top: 10px;">
                <p><b>ARV:</b> $291,100</p>
                <p><b>Avg $/sqft:</b> $204.80</p>
                <p><b>Confidence:</b> 85%</p>
              </div>
            </div>
          </div>

          <div class="offer-box">
            <div class="offer-row"><span>Valor de Mercado (ARV)</span><span>$${arv.toLocaleString()}</span></div>
            <div class="offer-row" style="color: #94a3b8;"><span>(-) Reforma Estimada (Med)</span><span>$${repairs.toLocaleString()}</span></div>
            <div class="offer-row" style="color: #94a3b8;"><span>(-) Margem Wholesale (8%)</span><span>$${margin.toLocaleString()}</span></div>
            <div class="offer-total">
              <div style="font-size: 11px; color: #94a3b8; font-weight: 400; margin-bottom: 5px;">OFERTA MÁXIMA PARA COMPRA</div>
              $${maxOffer.toLocaleString()}
            </div>
          </div>

          <div style="margin-top: 20px; display: flex; gap: 10px;">
            <button class="btn-primary" style="flex: 1; height: 50px;">GERAR PDF DA OFERTA</button>
            <button class="btn-outline" style="flex: 1; height: 50px;">NOTIFICAR DIRETORIA</button>
          </div>
        `;
      }
    }

    function moveStep(delta) { 
      currentStep += delta; 
      if(currentStep > 5) currentStep = 5; 
      if(currentStep < 1) currentStep = 1; 
      renderContent(); 
    }

    // Init
    renderContent();
  </script>
</body>
</html>
