<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow Estratégico - Integração Marketing & Dados</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --success: #16a34a;
      --warning: #ca8a04;
      --danger: #dc2626;
      --bg: #f8fafc;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--primary); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 350px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: #f8fafc; }
    .property-list { flex-grow: 1; overflow-y: auto; padding: 12px; background: #f1f5f9; }
    .prop-card { background: #fff; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; cursor: pointer; overflow: hidden; transition: 0.2s; position: relative; }
    .prop-card.active { border: 2px solid var(--accent); }
    .prop-img { width: 100%; height: 80px; object-fit: cover; }
    .prop-info { padding: 10px; }

    /* Main Area */
    .main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    .wizard-nav { background: #fff; padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: center; gap: 8px; }
    .step-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #94a3b8; padding: 6px 12px; border-radius: 8px; }
    .step-dot.active { background: #eff6ff; color: var(--accent); }
    .step-dot.done { color: var(--success); }

    /* Workspace */
    .workspace { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
    .content-container { width: 100%; max-width: 1000px; background: #fff; border-radius: 16px; border: 1px solid var(--border); min-height: 600px; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .content-body { padding: 30px; flex-grow: 1; }
    .content-footer { padding: 20px 30px; border-top: 1px solid var(--border); background: #f8fafc; display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 16px 16px; }

    /* Marketing UI Elements */
    .comparison-table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 13px; }
    .comparison-table th { background: #f8fafc; padding: 12px; text-align: left; border-bottom: 2px solid var(--border); }
    .comparison-table td { padding: 12px; border-bottom: 1px solid #f1f5f9; }
    .best-choice { background: #dcfce7; color: #166534; font-weight: 800; padding: 4px 8px; border-radius: 4px; }

    .timer-badge { background: #fee2e2; color: #991b1b; padding: 6px 12px; border-radius: 999px; font-size: 11px; font-weight: 800; display: inline-flex; align-items: center; gap: 6px; }
    .btn-primary { background: var(--accent); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-outline { padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: #fff; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 style="font-size: 16px;">Esteira de Aquisição</h2>
      <p style="font-size: 11px; color: #64748b;">Integração: Marketing & Dados</p>
    </div>
    <div class="property-list" id="propList"></div>
  </aside>

  <main class="main">
    <nav class="wizard-nav">
      <div class="step-dot" id="dot1">1. BASE</div>
      <div class="step-dot" id="dot2">2. ANÁLISE</div>
      <div class="step-dot" id="dot3">3. SKIP TRACE</div>
      <div class="step-dot" id="dot4">4. MERCADO</div>
      <div class="step-dot" id="dot5">5. OFERTA</div>
    </nav>

    <div class="workspace">
      <div class="content-container">
        <div class="content-body" id="stepContent"></div>
        <div class="content-footer">
          <button class="btn btn-outline" onclick="moveStep(-1)" id="backBtn">Voltar</button>
          <div id="stepInfo" style="font-size: 12px; font-weight: 700; color: #64748b;">PASSO 4 DE 5</div>
          <button class="btn btn-primary" onclick="moveStep(1)" id="nextBtn">Avançar →</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const properties = [
      { id: 1, address: "114 W Celeste St", city: "Orlando", sqft: 1420, avm: 295000, img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=400" }
    ];

    let currentStep = 4;

    function renderContent() {
      const body = document.getElementById('stepContent');
      const prop = properties[0];
      
      for(let i=1; i<=5; i++) {
        const dot = document.getElementById('dot'+i);
        dot.className = 'step-dot ' + (i < currentStep ? 'done' : i === currentStep ? 'active' : '');
      }

      if(currentStep === 4) {
        body.innerHTML = `
          <h3>Passo 4: Inteligência de Mercado (Zillow Comps)</h3>
          <p class="subtitle">Validando o After Repair Value (ARV) com prova social de vizinhos.</p>
          
          <div style="display:flex; gap:15px; margin-bottom:20px;">
            <div style="flex:1; background:#f0fdf4; border:1px solid #bbf7d0; padding:15px; border-radius:12px;">
              <span style="font-size:10px; color:#166534; font-weight:800;">MARKET TREND</span>
              <p style="font-size:18px; font-weight:900; color:#166534;">HOT 🔥 (+12% Year)</p>
            </div>
            <div style="flex:1; background:#eff6ff; border:1px solid #bfdbfe; padding:15px; border-radius:12px;">
              <span style="font-size:10px; color:#1e40af; font-weight:800;">TARGET AVG</span>
              <p style="font-size:18px; font-weight:900; color:#1e40af;">$204.80 /sqft</p>
            </div>
          </div>

          <table class="comparison-table">
            <thead>
              <tr><th>Endereço Vendido</th><th>Distância</th><th>Data</th><th>Preço</th></tr>
            </thead>
            <tbody>
              <tr><td>12 Oak Ave</td><td>0.2 mi</td><td>Nov/25</td><td>$280,000</td></tr>
              <tr><td>18 Pine Dr</td><td>0.4 mi</td><td>Out/25</td><td>$310,000</td></tr>
            </tbody>
          </table>
          
          <div style="margin-top:20px; background:#fefce8; padding:15px; border-radius:8px; border-left:4px solid #ca8a04;">
            <p style="font-size:12px;"><b>Insight de Conversão:</b> "Imóveis similares estão vendendo em menos de 10 dias. Use isso na negociação (Passo 5)."</p>
          </div>
        `;
      } else if (currentStep === 5) {
        body.innerHTML = `
          <div style="display:flex; justify-content: space-between; align-items: center;">
            <h3>Passo 5: Proposta Educativa (Win-Win)</h3>
            <div class="timer-badge">⏳ Expira em 7 dias</div>
          </div>
          <p class="subtitle">Gerando a comparação de lucro para o proprietário.</p>
          
          <table class="comparison-table" style="border: 1px solid var(--border); border-radius: 12px;">
            <thead>
              <tr><th>Critério</th><th>Venda Tradicional</th><th>Nossa Oferta Cash</th></tr>
            </thead>
            <tbody>
              <tr><td>Valor de Venda</td><td>$295,000</td><td>$196,812</td></tr>
              <tr><td>Comissão Realtor (6%)</td><td>-$17,700</td><td><b class="best-choice">$0.00</b></td></tr>
              <tr><td>Reparos Necessários</td><td>-$15,000</td><td><b class="best-choice">$0.00</b></td></tr>
              <tr><td>Closing Costs (2%)</td><td>-$5,900</td><td><b class="best-choice">$0.00</b></td></tr>
              <tr style="background:#f8fafc;">
                <td><b>LÍQUIDO NO SEU BOLSO</b></td>
                <td>$256,400</td>
                <td><b>$196,812</b></td>
              </tr>
            </tbody>
          </table>

          <div style="margin-top:20px; background:#f0f9ff; padding:20px; border-radius:12px;">
            <p style="font-size:14px; font-weight:700; color:#1e40af;">Argumento de Venda:</p>
            <p style="font-size:12px; color:#1e40af; margin-top:5px;">
              "A diferença líquida é de apenas $59k, mas com a gente você recebe em <b>7 dias</b>, sem vistorias e sem o risco da venda cair (30% de chance no tradicional)."
            </p>
          </div>

          <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn btn-primary" style="flex:1;">GERAR CONTRATO (DOCUSIGN)</button>
            <button class="btn btn-outline" style="flex:1;">ENVIAR PDF VIA WHATSAPP</button>
          </div>
        `;
      }
    }

    function moveStep(delta) { currentStep += delta; if(currentStep > 5) currentStep = 5; if(currentStep < 1) currentStep = 1; renderContent(); }
    renderContent();
  </script>
</body>
</html>
