<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow V3 - Análise Detalhada</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #ca8a04;
      --bg: #f1f5f9;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--primary); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar - Cards */
    .sidebar { width: 380px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: #f8fafc; }
    .property-list { flex-grow: 1; overflow-y: auto; padding: 15px; background: #f1f5f9; }
    
    .prop-card { 
      background: #fff; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; 
      cursor: pointer; overflow: hidden; transition: 0.2s; position: relative;
    }
    .prop-card.active { border: 2px solid var(--accent); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
    
    .prop-img { width: 100%; height: 100px; object-fit: cover; background: #cbd5e1; }
    .prop-info { padding: 12px; }
    .prop-address { font-weight: 800; font-size: 13px; display: block; }
    .status-pill { position: absolute; top: 8px; right: 8px; padding: 3px 8px; border-radius: 4px; font-size: 9px; font-weight: 800; background: rgba(0,0,0,0.7); color: #fff; }

    /* Main Area */
    .main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    .wizard-nav { background: #fff; padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: center; gap: 8px; }
    .step-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #94a3b8; padding: 6px 12px; border-radius: 8px; }
    .step-dot.active { background: #eff6ff; color: var(--accent); }
    .step-dot.done { color: var(--success); }

    /* Workspace */
    .workspace { flex-grow: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
    .content-container { width: 100%; max-width: 1000px; background: #fff; border-radius: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; min-height: 550px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .content-body { padding: 30px; flex-grow: 1; }
    .content-footer { padding: 20px 30px; border-top: 1px solid var(--border); background: #f8fafc; display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 16px 16px; }

    /* Passo 2 Específicos */
    .analysis-grid { display: grid; grid-template-columns: 1.2fr 1fr; gap: 25px; margin-top: 20px; }
    .decision-panel { background: #f8fafc; padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
    .stat-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
    .stat-val { font-weight: 700; }
    
    .btn-group-neg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 15px; }
    .btn-neg { padding: 8px; font-size: 11px; border: 1px solid #fee2e2; color: #991b1b; background: #fff; border-radius: 6px; cursor: pointer; }
    .btn-neg:hover { background: #fef2f2; }

    .btn-approve { width: 100%; padding: 15px; background: var(--success); color: #fff; border: none; border-radius: 8px; font-weight: 800; font-size: 16px; cursor: pointer; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(22, 163, 74, 0.2); }
    
    .map-preview { width: 100%; height: 180px; background: #e2e8f0; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #64748b; font-size: 12px; font-weight: 600; margin-bottom: 15px; border: 1px solid #cbd5e1; }

    /* Outros Steps */
    .import-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 30px; text-align: center; margin-bottom: 20px; background: #f8fafc; }
    .btn-primary { background: var(--accent); color: #fff; border: none; padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-outline { padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: #fff; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 style="font-size: 16px;">Esteira de Aquisição</h2>
      <p style="font-size: 11px; color: #64748b;">Fila: PROBATE_ORLANDO_26</p>
    </div>
    <div class="property-list" id="propList"></div>
  </aside>

  <main class="main">
    <nav class="wizard-nav">
      <div class="step-dot" id="dot1">1. BASE</div>
      <div class="step-dot" id="dot2">2. ANÁLISE</div>
      <div class="step-dot" id="dot3">3. SKIP TRACE</div>
      <div class="step-dot" id="dot4">4. COMPS</div>
      <div class="step-dot" id="dot5">5. OFERTA</div>
    </nav>

    <div class="workspace">
      <div class="content-container">
        <div class="content-body" id="stepContent"></div>
        <div class="content-footer">
          <button class="btn-outline" onclick="moveStep(-1)" id="backBtn">Voltar</button>
          <div id="stepInfo" style="font-size: 12px; font-weight: 700; color: #64748b;">PASSO 2 DE 5</div>
          <button class="btn-primary" onclick="moveStep(1)" id="nextBtn">Avançar →</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const properties = [
      { id: 1, address: "114 W Celeste St", city: "Orlando", beds: 3, baths: 2, sqft: 1420, year: 1958, avm: 295000, debt: 120000, img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=400" },
      { id: 2, address: "890 Oak Ave", city: "Kissimmee", beds: 4, baths: 3, sqft: 2100, year: 2005, avm: 410000, debt: 350000, img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=400" }
    ];

    let currentStep = 2; // Focando no Passo 2
    let selectedId = 1;

    function renderSidebar() {
      const container = document.getElementById('propList');
      container.innerHTML = properties.map(p => `
        <div class="prop-card ${p.id === selectedId ? 'active' : ''}" onclick="selectProp(${p.id})">
          <img src="${p.img}" class="prop-img">
          <div class="status-pill">Aguardando Análise</div>
          <div class="prop-info">
            <span class="prop-address">${p.address}</span>
            <span style="font-size:10px; color:#64748b;">${p.beds}bd | ${p.baths}ba | ${p.sqft}sqft</span>
          </div>
        </div>
      `).join('');
    }

    function renderContent() {
      const body = document.getElementById('stepContent');
      const prop = properties.find(p => p.id === selectedId);
      const equity = prop.avm - prop.debt;
      const equityPerc = Math.round((equity / prop.avm) * 100);
      
      for(let i=1; i<=5; i++) {
        const dot = document.getElementById('dot'+i);
        dot.className = 'step-dot ' + (i < currentStep ? 'done' : i === currentStep ? 'active' : '');
      }

      document.getElementById('stepInfo').innerText = `PASSO ${currentStep} DE 5`;

      if(currentStep === 2) {
        body.innerHTML = `
          <div style="display:flex; justify-content: space-between; align-items: flex-start;">
            <div>
              <h3>Passo 2: Análise de Viabilidade</h3>
              <p style="color: #64748b; margin-bottom: 20px;">Validação técnica e financeira para aprovação de Skip Trace.</p>
            </div>
            <div style="text-align:right;">
              <span style="font-size: 10px; font-weight:800; color:var(--accent);">SCORE DE EQUITY</span>
              <div style="font-size: 24px; font-weight:900; color:${equityPerc > 30 ? 'var(--success)' : 'var(--warning)'};">${equityPerc}%</div>
            </div>
          </div>
          
          <div class="analysis-grid">
            <div class="property-details">
              <div class="map-preview">
                <img src="${prop.img}" style="width:100%; height:100%; object-fit:cover; border-radius:8px;">
                <div style="position:absolute; bottom:20px; left:20px; background:rgba(0,0,0,0.6); color:#fff; padding:5px 10px; border-radius:4px; font-size:10px;">Street View Preview</div>
              </div>
              
              <div style="display:grid; grid-template-columns: 1fr 1fr; gap:15px;">
                <div class="stat-row"><span>Year Built:</span><span class="stat-val">${prop.year}</span></div>
                <div class="stat-row"><span>Stories:</span><span class="stat-val">1</span></div>
                <div class="stat-row"><span>Pool:</span><span class="stat-val">No</span></div>
                <div class="stat-row"><span>Lot Size:</span><span class="stat-val">7,500 sqft</span></div>
              </div>

              <div style="margin-top:20px; background:#f0f9ff; padding:15px; border-radius:8px; border-left:4px solid var(--accent);">
                <p style="font-size:12px; font-weight:700;">Observação do Lote:</p>
                <p style="font-size:12px; color:#1e40af;">Imóvel em inventário (Probate). Sarah Jackson faleceu em Jan/26. Filha é a provável herdeira.</p>
              </div>
            </div>

            <div class="decision-panel">
              <div class="stat-row" style="border-bottom: 2px solid #e2e8f0; margin-bottom: 10px;">
                <span style="font-weight:800;">VALORES ESTIMADOS</span>
              </div>
              <div class="stat-row"><span>Market Value (AVM):</span><span class="stat-val">$${prop.avm.toLocaleString()}</span></div>
              <div class="stat-row"><span>Estimated Liens:</span><span class="stat-val">$${prop.debt.toLocaleString()}</span></div>
              <div class="stat-row" style="color:var(--success); font-size:16px;">
                <span>Potential Equity:</span><span class="stat-val">$${equity.toLocaleString()}</span>
              </div>

              <div style="margin-top:30px;">
                <button class="btn-approve" onclick="moveStep(1)">APROVAR PARA SKIP TRACE</button>
                
                <p style="font-size:11px; font-weight:700; color:#64748b; text-align:center;">OU NEGAR POR MOTIVO:</p>
                <div class="btn-group-neg">
                  <button class="btn-neg">Low Equity</button>
                  <button class="btn-neg">Bad Location</button>
                  <button class="btn-neg">Commercial</button>
                  <button class="btn-neg">Already Contacted</button>
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (currentStep === 3) {
        body.innerHTML = `<h3>Passo 3: Skip Trace Unificado</h3>
          <p style="color: #64748b; margin-bottom: 20px;">Aprovado por: Analista Senior em 12/02/2026</p>
          <div class="import-zone">
            <p style="font-weight: 700; color: var(--accent);">📁 Upload do arquivo de retorno do fornecedor</p>
          </div>
          <div style="background:#f8fafc; padding:20px; border-radius:12px; border: 1px solid var(--border);">
            <h4>Contatos Localizados para ${prop.address}</h4>
            <!-- Lista de contatos igual ao protótipo anterior -->
          </div>
        `;
      } else {
        body.innerHTML = `<h3>Passo ${currentStep}</h3><p>Fluxo em construção...</p>`;
      }
    }

    function selectProp(id) { selectedId = id; currentStep = 2; renderSidebar(); renderContent(); }
    function moveStep(delta) { currentStep += delta; if(currentStep > 5) currentStep = 5; if(currentStep < 1) currentStep = 1; renderContent(); }

    renderSidebar(); renderContent();
  </script>
</body>
</html>
