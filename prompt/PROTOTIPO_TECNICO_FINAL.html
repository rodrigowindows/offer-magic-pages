<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow Técnico - Integração AVMService</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --success: #16a34a;
      --warning: #ca8a04;
      --bg: #f1f5f9;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--primary); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 350px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: #f8fafc; }
    .property-list { flex-grow: 1; overflow-y: auto; padding: 15px; }
    .prop-card { background: #fff; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; cursor: pointer; overflow: hidden; }
    .prop-card.active { border: 2px solid var(--accent); background: #eff6ff; }
    .prop-img { width: 100%; height: 80px; object-fit: cover; }
    .prop-info { padding: 10px; }

    /* Main Area */
    .main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    .wizard-nav { background: #fff; padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: center; gap: 8px; }
    .step-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #94a3b8; padding: 6px 12px; border-radius: 8px; }
    .step-dot.active { background: #eff6ff; color: var(--accent); }
    .step-dot.done { color: var(--success); }

    /* Workspace */
    .workspace { flex-grow: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
    .content-container { width: 100%; max-width: 1000px; background: #fff; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.05); min-height: 600px; display: flex; flex-direction: column; }
    .content-body { padding: 30px; flex-grow: 1; }
    .content-footer { padding: 20px 30px; border-top: 1px solid var(--border); background: #f8fafc; display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 16px 16px; }

    /* AVM Breakdown UI */
    .avm-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
    .method-card { background: #f8fafc; padding: 15px; border-radius: 10px; border: 1px solid var(--border); }
    .method-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
    .val-bold { font-weight: 800; }

    .confidence-bar { height: 8px; background: #e2e8f0; border-radius: 4px; margin-top: 5px; overflow: hidden; }
    .confidence-fill { height: 100%; background: var(--success); transition: 0.3s; }

    .offer-box { background: #0f172a; color: #fff; padding: 30px; border-radius: 16px; margin-top: 20px; }
    .offer-total { font-size: 32px; font-weight: 900; color: var(--success); border-top: 1px solid #334155; margin-top: 20px; padding-top: 20px; }

    .btn-primary { background: var(--accent); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-outline { padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: #fff; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 style="font-size: 16px;">Esteira de Aquisição</h2>
      <p style="font-size: 11px; color: #64748b;">Integração: AVMService.ts</p>
    </div>
    <div class="property-list" id="propList"></div>
  </aside>

  <main class="main">
    <nav class="wizard-nav">
      <div class="step-dot" id="dot1">1. BASE</div>
      <div class="step-dot" id="dot2">2. ANÁLISE</div>
      <div class="step-dot" id="dot3">3. SKIP TRACE</div>
      <div class="step-dot" id="dot4">4. MERCADO</div>
      <div class="step-dot" id="dot5">5. OFERTA</div>
    </nav>

    <div class="workspace">
      <div class="content-container">
        <div class="content-body" id="stepContent"></div>
        <div class="content-footer">
          <button class="btn btn-outline" onclick="moveStep(-1)" id="backBtn">Voltar</button>
          <div id="stepInfo" style="font-size: 12px; font-weight: 700; color: #64748b;">PASSO 4 DE 5</div>
          <button class="btn btn-primary" onclick="moveStep(1)" id="nextBtn">Avançar →</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const properties = [
      { id: 1, address: "114 W Celeste St", city: "Orlando", sqft: 1420, avm: 295000, img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=400" }
    ];

    let currentStep = 4;

    function renderContent() {
      const body = document.getElementById('stepContent');
      const prop = properties[0];
      
      for(let i=1; i<=5; i++) {
        const dot = document.getElementById('dot'+i);
        dot.className = 'step-dot ' + (i < currentStep ? 'done' : i === currentStep ? 'active' : '');
      }

      if(currentStep === 4) {
        body.innerHTML = `
          <h3>Passo 4: AVM - Reconciliação Técnica</h3>
          <p class="subtitle">Integração real com <b>AVMService.ts</b></p>
          
          <div style="background: #eff6ff; padding: 20px; border-radius: 12px; border-left: 5px solid var(--accent);">
            <div style="display:flex; justify-content: space-between;">
              <span style="font-weight:800;">ESTIMATED VALUE (RECONCILED)</span>
              <span style="font-size:24px; font-weight:900; color:var(--accent);">$291,100</span>
            </div>
            <div style="margin-top:10px;">
              <div style="display:flex; justify-content: space-between; font-size:11px;">
                <span>Confiança do Algoritmo</span>
                <span>87% (Excelente)</span>
              </div>
              <div class="confidence-bar"><div class="confidence-fill" style="width: 87%;"></div></div>
            </div>
          </div>

          <div class="avm-grid">
            <div class="method-card">
              <p style="font-size:11px; font-weight:800; color:#64748b; margin-bottom:10px;">MÉTODOS DE RECONCILIAÇÃO</p>
              <div class="method-row"><span>Weighted Value (60%)</span><span class="val-bold">$292,450</span></div>
              <div class="method-row"><span>Median Value (25%)</span><span class="val-bold">$289,900</span></div>
              <div class="method-row"><span>Average Value (15%)</span><span class="val-bold">$290,500</span></div>
            </div>
            <div class="method-card">
              <p style="font-size:11px; font-weight:800; color:#64748b; margin-bottom:10px;">MÉTRICAS DE QUALIDADE</p>
              <div class="method-row"><span>Desvio Padrão (σ)</span><span class="val-bold">$8,450</span></div>
              <div class="method-row"><span>Intervalo Min</span><span class="val-bold">$282,650</span></div>
              <div class="method-row"><span>Intervalo Max</span><span class="val-bold">$299,550</span></div>
            </div>
          </div>

          <p style="font-size: 11px; color: #64748b; margin-top: 20px;">
            <b>Nota Técnica:</b> A estimativa usa a técnica de 1.5σ para o intervalo de segurança e compensa disparidades de Sqft e Quartos automaticamente.
          </p>
        `;
      } else if (currentStep === 5) {
        body.innerHTML = `
          <h3>Passo 5: Proposta e Oferta Final</h3>
          <p class="subtitle">Derivado diretamente da reconciliação técnica do Passo 4.</p>
          
          <div class="offer-box">
            <div class="offer-row"><span>AVM Final (Mercado Reconciliado)</span><span>$291,100</span></div>
            <div class="offer-row" style="color: #94a3b8;"><span>(-) Reforma Média ($50/sqft)</span><span>$71,000</span></div>
            <div class="offer-row" style="color: #94a3b8;"><span>(-) Margem de Lucro Wholesale (8%)</span><span>$23,288</span></div>
            <div class="offer-total">
              <div style="font-size: 11px; color: #94a3b8; font-weight: 400; margin-bottom: 5px;">OFERTA MÁXIMA PARA COMPRA</div>
              $196,812
            </div>
          </div>
          
          <div style="display:flex; gap:10px; margin-top:20px;">
            <button class="btn btn-primary" style="flex:1;">GERAR PDF DA OFERTA</button>
            <button class="btn btn-outline" style="flex:1;">NOTIFICAR DIRETORIA</button>
          </div>
        `;
      }
    }

    function moveStep(delta) { currentStep += delta; if(currentStep > 5) currentStep = 5; if(currentStep < 1) currentStep = 1; renderContent(); }
    renderContent();
  </script>
</body>
</html>
