<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow V4 - Ciclo Completo de Aquisição</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #ca8a04;
      --bg: #f1f5f9;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--primary); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sidebar { width: 350px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: #f8fafc; }
    .property-list { flex-grow: 1; overflow-y: auto; padding: 15px; background: #f1f5f9; }
    .prop-card { background: #fff; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; cursor: pointer; overflow: hidden; transition: 0.2s; position: relative; }
    .prop-card.active { border: 2px solid var(--accent); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15); }
    .prop-img { width: 100%; height: 80px; object-fit: cover; background: #cbd5e1; }
    .prop-info { padding: 10px; }
    .prop-address { font-weight: 800; font-size: 13px; display: block; }

    /* Main Area */
    .main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    .wizard-nav { background: #fff; padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: center; gap: 8px; }
    .step-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #94a3b8; padding: 6px 12px; border-radius: 8px; }
    .step-dot.active { background: #eff6ff; color: var(--accent); }
    .step-dot.done { color: var(--success); }

    /* Workspace */
    .workspace { flex-grow: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
    .content-container { width: 100%; max-width: 1000px; background: #fff; border-radius: 16px; border: 1px solid var(--border); display: flex; flex-direction: column; min-height: 600px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
    .content-body { padding: 30px; flex-grow: 1; }
    .content-footer { padding: 20px 30px; border-top: 1px solid var(--border); background: #f8fafc; display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 16px 16px; }

    /* UI Components */
    h3 { font-size: 22px; margin-bottom: 8px; font-weight: 800; }
    .subtitle { color: #64748b; font-size: 14px; margin-bottom: 25px; }
    .table-ui { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    .table-ui th { text-align: left; padding: 10px; border-bottom: 2px solid #f1f5f9; color: #64748b; }
    .table-ui td { padding: 10px; border-bottom: 1px solid #f1f5f9; }
    
    .calc-box { background: #0f172a; color: #fff; padding: 25px; border-radius: 12px; margin-top: 20px; }
    .calc-row { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 14px; }
    .calc-total { font-size: 28px; font-weight: 900; color: var(--success); border-top: 1px solid #334155; margin-top: 15px; padding-top: 15px; }

    .param-card { border: 1px solid var(--border); border-radius: 10px; padding: 15px; background: #f8fafc; }
    .btn-primary { background: var(--accent); color: #fff; border: none; padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; }
    .btn-outline { padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); background: #fff; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 style="font-size: 16px;">Workflow de Aquisição</h2>
      <p style="font-size: 11px; color: #64748b;">Fila: PROBATE_ORLANDO_26</p>
    </div>
    <div class="property-list" id="propList"></div>
  </aside>

  <main class="main">
    <nav class="wizard-nav" id="navSteps">
      <div class="step-dot" id="dot1">1. BASE</div>
      <div class="step-dot" id="dot2">2. ANÁLISE</div>
      <div class="step-dot" id="dot3">3. SKIP TRACE</div>
      <div class="step-dot" id="dot4">4. MERCADO</div>
      <div class="step-dot" id="dot5">5. OFERTA</div>
    </nav>

    <div class="workspace">
      <div class="content-container">
        <div class="content-body" id="stepContent"></div>
        <div class="content-footer">
          <button class="btn-outline" onclick="moveStep(-1)" id="backBtn">Voltar</button>
          <div id="stepInfo" style="font-size: 12px; font-weight: 700; color: #64748b;">PASSO 1 DE 5</div>
          <button class="btn-primary" onclick="moveStep(1)" id="nextBtn">Próximo Passo →</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const properties = [
      { id: 1, address: "114 W Celeste St", city: "Orlando", sqft: 1420, img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=400" },
      { id: 2, address: "890 Oak Ave", city: "Kissimmee", sqft: 2100, img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=400" }
    ];

    let currentStep = 1;
    let selectedId = 1;

    function renderSidebar() {
      const container = document.getElementById('propList');
      container.innerHTML = properties.map(p => `
        <div class="prop-card ${p.id === selectedId ? 'active' : ''}" onclick="selectProp(${p.id})">
          <img src="${p.img}" class="prop-img">
          <div class="prop-info">
            <span class="prop-address">${p.address}</span>
            <span style="font-size:10px; color:#64748b;">${p.sqft} sqft</span>
          </div>
        </div>
      `).join('');
    }

    function renderContent() {
      const body = document.getElementById('stepContent');
      const prop = properties.find(p => p.id === selectedId);
      
      for(let i=1; i<=5; i++) {
        const dot = document.getElementById('dot'+i);
        dot.className = 'step-dot ' + (i < currentStep ? 'done' : i === currentStep ? 'active' : '');
      }

      document.getElementById('stepInfo').innerText = `PASSO ${currentStep} DE 5`;
      document.getElementById('backBtn').style.display = currentStep === 1 ? 'none' : 'block';
      document.getElementById('nextBtn').innerText = currentStep === 5 ? 'Gerar PDF e Finalizar' : 'Próximo Passo →';

      if(currentStep === 1) {
        body.innerHTML = `<h3>Passo 1: Identificação da Base</h3>
          <p class="subtitle">Verificação de inventário e duplicidade de dados.</p>
          <div style="background:#f8fafc; padding:20px; border-radius:12px; border:1px solid #e2e8f0;">
            <p><b>Endereço Identificado:</b> ${prop.address}</p>
            <p><b>Lote:</b> PROBATE_ORLANDO_FEV</p>
            <div style="margin-top:15px; color:var(--success); font-weight:700;">✅ Imóvel único no banco de dados. Pronto para análise.</div>
          </div>`;
      } else if (currentStep === 2) {
        body.innerHTML = `<h3>Passo 2: Análise de Viabilidade</h3>
          <p class="subtitle">Triagem rápida baseada em equity e localização.</p>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
            <div class="param-card">
              <p><b>Estimativa AVM:</b> $295,000</p>
              <p><b>Dívida Estimada:</b> $120,000</p>
              <p style="color:var(--success); font-weight:800; margin-top:10px;">Equity Estimado: $175,000 (59%)</p>
            </div>
            <div>
              <button class="btn-primary" style="width:100%; background:var(--success); margin-bottom:10px;" onclick="moveStep(1)">APROVAR</button>
              <button class="btn-outline" style="width:100%; color:var(--danger); border-color:var(--danger);">NEGAR</button>
            </div>
          </div>`;
      } else if (currentStep === 3) {
        body.innerHTML = `<h3>Passo 3: Skip Trace Unificado</h3>
          <p class="subtitle">Centralização de contatos e identificação de sócios PJ.</p>
          <div style="border:2px dashed var(--border); padding:30px; text-align:center; border-radius:12px; margin-bottom:20px; cursor:pointer;">
            📁 Upload do Retorno de Skip Trace (CSV)
          </div>
          <table class="table-ui">
            <tr><th>Pessoa</th><th>Tipo</th><th>Contato</th><th>Fonte</th></tr>
            <tr><td><b>Sarah Jackson</b></td><td>Owner</td><td>(407) 555-0101</td><td>Vendor A</td></tr>
            <tr><td><b>John Doe</b></td><td>Manager (LLC)</td><td>john@llc.com</td><td>Manual</td></tr>
          </table>`;
      } else if (currentStep === 4) {
        body.innerHTML = `<h3>Passo 4: Análise de Mercado (Comps)</h3>
          <p class="subtitle">Definição do ARV baseado em vendas similares recentes.</p>
          <div style="background:#eff6ff; padding:15px; border-radius:8px; margin-bottom:15px; font-size:12px;">
            <b>Imóvel Alvo:</b> ${prop.address} | <b>Área:</b> ${prop.sqft} sqft
          </div>
          <table class="table-ui">
            <thead>
              <tr><th>Status</th><th>Endereço Comp</th><th>Preço Venda</th><th>Sqft</th><th>$/sqft</th></tr>
            </thead>
            <tbody>
              <tr><td>✅</td><td>12 Oak Ave (0.2 mi)</td><td>$280,000</td><td>1,400</td><td>$200.00</td></tr>
              <tr><td>✅</td><td>18 Pine Dr (0.4 mi)</td><td>$310,000</td><td>1,500</td><td>$206.66</td></tr>
              <tr><td>✅</td><td>22 Elm St (0.3 mi)</td><td>$295,000</td><td>1,420</td><td>$207.74</td></tr>
            </tbody>
          </table>
          <div style="margin-top:20px; text-align:right;">
            <span style="color:#64748b; font-weight:700;">MÉDIA SELECIONADA:</span>
            <span style="font-size:24px; font-weight:900; color:var(--accent); margin-left:10px;">$204.80 /sqft</span>
          </div>`;
      } else if (currentStep === 5) {
        const avgSqft = 204.80;
        const arv = Math.round(avgSqft * prop.sqft);
        const repairs = Math.round(prop.sqft * 50); // Medium repair
        const margin = Math.round(arv * 0.08); // 8% margin
        const maxOffer = arv - repairs - margin;

        body.innerHTML = `<h3>Passo 5: Cálculo da Oferta Mínima</h3>
          <p class="subtitle">Fórmula de lucro protegida contra riscos.</p>
          <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px;">
            <div class="param-card">
              <p style="font-weight:700; margin-bottom:10px;">Parâmetros da Oferta:</p>
              <div class="stat-row" style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:8px;">
                <span>Nível de Reforma:</span> <b>Médio ($50/sqft)</b>
              </div>
              <div class="stat-row" style="display:flex; justify-content:space-between; font-size:12px; margin-bottom:8px;">
                <span>Margem Lucro:</span> <b>8% (Wholesale)</b>
              </div>
            </div>
            <div class="param-card">
              <p style="font-weight:700; margin-bottom:10px;">Resultado do Mercado (P4):</p>
              <p style="font-size:18px; color:var(--accent); font-weight:800;">$${avgSqft.toFixed(2)} /sqft</p>
            </div>
          </div>

          <div class="calc-box">
            <div class="calc-row"><span>ARV Estimado (${prop.sqft} sqft × $204.80)</span><span>$${arv.toLocaleString()}</span></div>
            <div class="calc-row" style="color:#94a3b8;"><span>(-) Custo Reforma Estimado</span><span>$${repairs.toLocaleString()}</span></div>
            <div class="calc-row" style="color:#94a3b8;"><span>(-) Margem de Segurança (8%)</span><span>$${margin.toLocaleString()}</span></div>
            <div class="calc-total">
              <div style="font-size:12px; color:#94a3b8; font-weight:400; margin-bottom:5px;">OFERTA MÁXIMA PARA COMPRA</div>
              $${maxOffer.toLocaleString()}
            </div>
          </div>`;
      }
    }

    function selectProp(id) { selectedId = id; currentStep = 1; renderSidebar(); renderContent(); }
    function moveStep(delta) { 
      currentStep += delta; 
      if(currentStep > 5) { alert("PDF de Oferta Gerado! Enviando para o CRM..."); currentStep = 5; }
      if(currentStep < 1) currentStep = 1; 
      renderContent(); 
    }

    renderSidebar(); renderContent();
  </script>
</body>
</html>
