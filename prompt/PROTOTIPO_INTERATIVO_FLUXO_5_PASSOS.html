<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Protótipo Interativo - Fluxo de Aquisição 5 Passos</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --bg: #f8fafc;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--primary); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar - Fila de Trabalho */
    .sidebar { width: 320px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 24px; border-bottom: 1px solid var(--border); }
    .sidebar-header h2 { font-size: 18px; font-weight: 800; }
    .property-list { flex-grow: 1; overflow-y: auto; padding: 12px; }
    .property-card { padding: 16px; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; cursor: pointer; transition: all 0.2s; position: relative; }
    .property-card:hover { border-color: var(--accent); }
    .property-card.active { border-color: var(--accent); background: #eff6ff; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    .property-card b { display: block; font-size: 14px; margin-bottom: 4px; }
    .property-card span { font-size: 11px; color: #64748b; }
    .status-dot { position: absolute; top: 16px; right: 16px; width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; }
    .status-done { background: var(--success); }

    /* Main Area */
    .main { flex-grow: 1; display: flex; flex-direction: column; background: #f1f5f9; }
    
    /* Wizard Header */
    .wizard-nav { background: #fff; padding: 16px 40px; border-bottom: 1px solid var(--border); display: flex; justify-content: center; gap: 8px; }
    .step-item { display: flex; align-items: center; gap: 8px; padding: 8px 16px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #94a3b8; background: #f8fafc; border: 1px solid var(--border); transition: 0.3s; cursor: default; }
    .step-item.active { background: var(--accent); color: #fff; border-color: var(--accent); transform: scale(1.05); }
    .step-item.completed { background: #dcfce7; color: #166534; border-color: #bbf7d0; }

    /* Workspace */
    .workspace { flex-grow: 1; padding: 40px; overflow-y: auto; display: flex; justify-content: center; }
    .content-card { width: 100%; max-width: 900px; background: #fff; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid var(--border); display: flex; flex-direction: column; }
    .content-body { padding: 40px; flex-grow: 1; }
    .content-footer { padding: 24px 40px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: #f8fafc; border-radius: 0 0 20px 20px; }

    /* UI Components */
    h3 { font-size: 24px; margin-bottom: 8px; font-weight: 800; }
    .subtitle { color: #64748b; font-size: 14px; margin-bottom: 30px; }
    .btn { padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); transition: 0.2s; font-size: 14px; }
    .btn-primary { background: var(--accent); color: #fff; border: none; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: var(--success); color: #fff; border: none; }
    .btn-danger { background: var(--danger); color: #fff; border: none; }
    
    .info-box { background: #eff6ff; border-left: 4px solid var(--accent); padding: 16px; margin-bottom: 24px; border-radius: 0 8px 8px 0; font-size: 13px; }
    .table-ui { width: 100%; border-collapse: collapse; margin-top: 20px; }
    .table-ui th { text-align: left; padding: 12px; border-bottom: 2px solid var(--bg); color: #64748b; font-size: 12px; text-transform: uppercase; }
    .table-ui td { padding: 12px; border-bottom: 1px solid var(--bg); font-size: 14px; }

    /* Hidden Steps */
    .step-pane { display: none; }
    .step-pane.active { display: block; }
  </style>
</head>
<body>

  <!-- Sidebar com Fila de Imóveis -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <h2>Fila de Trabalho</h2>
      <p style="font-size: 12px; color: #64748b;">Lote: PROBATE_ORLANDO_26</p>
    </div>
    <div class="property-list" id="propertyList">
      <!-- Injetado via JS -->
    </div>
  </aside>

  <!-- Área Principal -->
  <main class="main">
    <nav class="wizard-nav" id="wizardNav">
      <div class="step-item" data-step="1">1. Base</div>
      <div class="step-item" data-step="2">2. Análise</div>
      <div class="step-item" data-step="3">3. Contatos</div>
      <div class="step-item" data-step="4">4. Mercado</div>
      <div class="step-item" data-step="5">5. Oferta</div>
    </nav>

    <div class="workspace">
      <div class="content-card">
        <div class="content-body" id="stepContent">
          <!-- O conteúdo dos passos será injetado aqui pelo JavaScript -->
        </div>
        <div class="content-footer">
          <button class="btn" id="prevBtn" onclick="changeStep(-1)">Anterior</button>
          <div style="font-size: 12px; color: #94a3b8;" id="stepProgressText">Passo 1 de 5</div>
          <button class="btn btn-primary" id="nextBtn" onclick="changeStep(1)">Próximo Passo</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const properties = [
      { id: 1, address: "114 W Celeste St", city: "Orlando", status: "pending", step: 1 },
      { id: 2, address: "25217 Mathew St", city: "Apopka", status: "pending", step: 1 },
      { id: 3, address: "890 Oak Ave", city: "Kissimmee", status: "done", step: 5 }
    ];

    let currentStep = 1;
    let selectedProperty = properties[0];

    const stepInfo = {
      1: {
        title: "Passo 1: Gestão da Base",
        subtitle: "Organização do inventário e verificação de duplicidade.",
        content: `
          <div class="info-box">
            <b>Ganho de Negócio:</b> O sistema detecta se este imóvel já foi importado antes, evitando gasto duplo com Skip Trace.
          </div>
          <div style="padding: 30px; border: 2px dashed var(--border); text-align: center; border-radius: 12px;">
            <p>Propriedade identificada no lote <b>PROBATE_FEV_26</b></p>
            <p style="font-size: 12px; color: #64748b; margin-top: 8px;">Origem dos dados: Importação CSV</p>
          </div>
          <table class="table-ui">
            <tr><th>Campo</th><th>Valor</th></tr>
            <tr><td>Owner Name</td><td>JACKSON SARAH ESTATE</td></tr>
            <tr><td>Property Type</td><td>Single Family</td></tr>
            <tr><td>Year Built</td><td>1958</td></tr>
          </table>
        `
      },
      2: {
        title: "Passo 2: Análise de Interesse",
        subtitle: "Decidir se o imóvel vale o investimento de tempo e dinheiro.",
        content: `
          <div class="info-box" style="border-color: var(--warning); background: #fffbeb;">
            <b>Regra Business:</b> Se negar, o motivo é obrigatório para alimentar nossa inteligência de mercado.
          </div>
          <div style="display: flex; gap: 20px; margin-bottom: 30px;">
            <button class="btn btn-success" style="flex: 1; height: 80px; font-size: 18px;" onclick="changeStep(1)">APROVAR PARA CONTATO</button>
            <button class="btn btn-danger" style="flex: 1; height: 80px; font-size: 18px;">NEGAR IMÓVEL</button>
          </div>
          <p><b>Por que aprovar?</b> Equity estimado de 40%, área em valorização.</p>
        `
      },
      3: {
        title: "Passo 3: Workspace de Contatos",
        subtitle: "Unificação do Skip Trace. O coração da operação comercial.",
        content: `
          <div class="info-box" style="border-color: var(--success); background: #f0fdf4;">
            <b>Diferencial Real:</b> Identificamos os sócios (Officers) caso o dono seja uma empresa (LLC).
          </div>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 20px;">
            <div style="padding: 15px; border: 1px solid var(--border); border-radius: 8px;">
              <p style="font-size: 11px; font-weight: 700;">1. EXTRAIR DADOS</p>
              <button class="btn" style="width: 100%; margin-top: 8px;">Exportar para Vendor</button>
            </div>
            <div style="padding: 15px; border: 1px solid var(--border); border-radius: 8px; background: #f8fafc;">
              <p style="font-size: 11px; font-weight: 700;">2. SUBIR RETORNO</p>
              <button class="btn" style="width: 100%; margin-top: 8px; border-style: dashed;">Upload CSV Vendor</button>
            </div>
          </div>
          <table class="table-ui">
            <thead>
              <tr><th>Nome/Sócio</th><th>Tipo</th><th>Contato</th><th>Fonte</th></tr>
            </thead>
            <tbody>
              <tr><td>Sarah Jackson</td><td>Owner</td><td>(407) 555-1212</td><td>Vendor A</td></tr>
              <tr><td><b>John Doe (CEO)</b></td><td>Officer</td><td>john@llc.com</td><td>Manual</td></tr>
            </tbody>
          </table>
        `
      },
      4: {
        title: "Passo 4: Análise de Mercado (Comps)",
        subtitle: "Definindo o valor de venda (ARV) através de comparativos reais.",
        content: `
          <div class="info-box">
            <b>Cálculo Automático:</b> Adicione as casas vendidas ao lado e o sistema calcula a média por sqft.
          </div>
          <table class="table-ui">
            <thead>
              <tr><th>Endereço Comp</th><th>Venda</th><th>Sqft</th><th>$/sqft</th></tr>
            </thead>
            <tbody>
              <tr><td>12 Oak Ave</td><td>$280,000</td><td>1,400</td><td>$200.00</td></tr>
              <tr><td>18 Pine Dr</td><td>$310,000</td><td>1,500</td><td>$206.66</td></tr>
              <tr style="background: #f8fafc; font-weight: 800;">
                <td colspan="3">MÉDIA FINAL DO MERCADO</td>
                <td style="color: var(--accent);">$203.33</td>
              </tr>
            </tbody>
          </table>
        `
      },
      5: {
        title: "Passo 5: Cálculo da Oferta Mínima",
        subtitle: "O valor final que podemos pagar para garantir o lucro.",
        content: `
          <div style="background: var(--primary); color: #fff; padding: 30px; border-radius: 16px;">
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; border-bottom: 1px solid #334155; padding-bottom: 10px;">
              <span>ARV (Valor de Mercado)</span>
              <span>$288,728</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 10px; color: #94a3b8;">
              <span>(-) Reforma Estimada (25%)</span>
              <span>$72,182</span>
            </div>
            <div style="display: flex; justify-content: space-between; margin-bottom: 20px; color: #94a3b8;">
              <span>(-) Margem Wholesale (8%)</span>
              <span>$23,098</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 24px; font-weight: 800; color: var(--success);">
              <span>OFERTA MÁXIMA</span>
              <span>$193,448</span>
            </div>
          </div>
          <button class="btn btn-primary" style="width: 100%; margin-top: 20px; height: 50px;">GERAR PDF DA PROPOSTA</button>
        `
      }
    };

    function renderSidebar() {
      const list = document.getElementById('propertyList');
      list.innerHTML = properties.map(p => `
        <div class="property-card ${selectedProperty.id === p.id ? 'active' : ''}" onclick="selectProperty(${p.id})">
          <b>${p.address}</b>
          <span>${p.city}, FL</span>
          <div class="status-dot ${p.status === 'done' ? 'status-done' : ''}"></div>
        </div>
      `).join('');
    }

    function renderStep() {
      const content = document.getElementById('stepContent');
      const step = stepInfo[currentStep];
      content.innerHTML = `<h3>${step.title}</h3><p class="subtitle">${step.subtitle}</p>${step.content}`;
      
      // Update wizard nav
      document.querySelectorAll('.step-item').forEach(item => {
        const stepNum = parseInt(item.dataset.step);
        item.className = 'step-item';
        if (stepNum === currentStep) item.classList.add('active');
        if (stepNum < currentStep) item.classList.add('completed');
      });

      document.getElementById('stepProgressText').innerText = `Passo ${currentStep} de 5`;
      document.getElementById('prevBtn').style.visibility = currentStep === 1 ? 'hidden' : 'visible';
      document.getElementById('nextBtn').innerText = currentStep === 5 ? 'Finalizar e Salvar' : 'Próximo Passo →';
    }

    function changeStep(delta) {
      currentStep += delta;
      if (currentStep > 5) {
        alert("Processo Finalizado com Sucesso! Imóvel movido para Campanhas.");
        currentStep = 5;
      }
      if (currentStep < 1) currentStep = 1;
      renderStep();
    }

    function selectProperty(id) {
      selectedProperty = properties.find(p => p.id === id);
      currentStep = 1; // Reset para o primeiro passo ao trocar de imóvel
      renderSidebar();
      renderStep();
    }

    // Inicialização
    renderSidebar();
    renderStep();
  </script>
</body>
</html>
