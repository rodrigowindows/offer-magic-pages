<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow Visual V2 - Aquisição Pro</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --success: #16a34a;
      --warning: #ca8a04;
      --bg: #f1f5f9;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--primary); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar - Cards de Propriedades */
    .sidebar { width: 380px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: #f8fafc; }
    .property-list { flex-grow: 1; overflow-y: auto; padding: 15px; background: #f1f5f9; }
    
    .prop-card { 
      background: #fff; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 15px; 
      cursor: pointer; overflow: hidden; transition: 0.2s; position: relative;
    }
    .prop-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
    .prop-card.active { border: 2px solid var(--accent); ring: 2px var(--accent); }
    
    .prop-img { width: 100%; height: 120px; object-fit: cover; background: #cbd5e1; }
    .prop-info { padding: 12px; }
    .prop-address { font-weight: 800; font-size: 14px; display: block; margin-bottom: 4px; }
    .prop-meta { font-size: 11px; color: #64748b; display: flex; gap: 8px; }
    .status-pill { position: absolute; top: 10px; right: 10px; padding: 4px 8px; border-radius: 6px; font-size: 10px; font-weight: 700; background: rgba(0,0,0,0.6); color: #fff; }

    /* Main Area */
    .main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    .wizard-nav { background: #fff; padding: 15px; border-bottom: 1px solid var(--border); display: flex; justify-content: center; gap: 10px; }
    .step-dot { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; color: #94a3b8; padding: 6px 12px; border-radius: 8px; }
    .step-dot.active { background: #eff6ff; color: var(--accent); }
    .step-dot.done { color: var(--success); }

    /* Workspace Content */
    .workspace { flex-grow: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
    .content-container { width: 100%; max-width: 1000px; background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); border: 1px solid var(--border); display: flex; flex-direction: column; min-height: 500px; }
    .content-body { padding: 30px; flex-grow: 1; }
    .content-footer { padding: 20px 30px; border-top: 1px solid var(--border); background: #f8fafc; display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 16px 16px; }

    /* Skip Trace UI Elements */
    .import-zone { border: 2px dashed var(--border); border-radius: 12px; padding: 30px; text-align: center; margin-bottom: 20px; background: #f8fafc; cursor: pointer; transition: 0.2s; }
    .import-zone:hover { border-color: var(--accent); background: #f0f7ff; }
    .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .data-card { border: 1px solid var(--border); border-radius: 10px; padding: 15px; }
    .source-tag { font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #e2e8f0; font-weight: 700; margin-left: 8px; }

    /* Buttons */
    .btn { padding: 10px 20px; border-radius: 8px; font-weight: 700; cursor: pointer; border: 1px solid var(--border); font-size: 14px; }
    .btn-primary { background: var(--accent); color: #fff; border: none; }
    .btn-outline { background: #fff; }
    
    .badge-pj { background: #fef2f2; color: #991b1b; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 style="font-size: 16px;">Esteira de Aquisição</h2>
      <p style="font-size: 11px; color: #64748b;">Analista: Operador 01 | Lote: FEV_26</p>
    </div>
    <div class="property-list" id="propList">
      <!-- Cards injetados via JS -->
    </div>
  </aside>

  <main class="main">
    <nav class="wizard-nav">
      <div class="step-dot" id="dot1">1. BASE</div>
      <div class="step-dot" id="dot2">2. ANÁLISE</div>
      <div class="step-dot" id="dot3">3. SKIP TRACE</div>
      <div class="step-dot" id="dot4">4. COMPS</div>
      <div class="step-dot" id="dot5">5. OFERTA</div>
    </nav>

    <div class="workspace">
      <div class="content-container">
        <div class="content-body" id="stepContent">
          <!-- Conteúdo Dinâmico -->
        </div>
        <div class="content-footer">
          <button class="btn btn-outline" onclick="moveStep(-1)" id="backBtn">Voltar</button>
          <div id="stepInfo" style="font-size: 12px; font-weight: 700; color: #64748b;">PASSO 3 DE 5</div>
          <button class="btn btn-primary" onclick="moveStep(1)" id="nextBtn">Próximo Passo →</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const properties = [
      { 
        id: 1, address: "114 W Celeste St", city: "Orlando", beds: 3, baths: 2, sqft: 1420, year: 1958, 
        img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994?auto=format&fit=crop&w=400&q=80",
        type: "Indivíduo", status: "Skip Trace Pendente"
      },
      { 
        id: 2, address: "890 Oak Ave", city: "Kissimmee", beds: 4, baths: 3, sqft: 2100, year: 2005, 
        img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?auto=format&fit=crop&w=400&q=80",
        type: "PJ (LLC)", status: "Análise"
      },
      { 
        id: 3, address: "25217 Mathew St", city: "Apopka", beds: 2, baths: 1, sqft: 980, year: 1940, 
        img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=400&q=80",
        type: "Indivíduo", status: "Oferta Gerada"
      }
    ];

    let currentStep = 3; // Começamos no 3 para mostrar o Skip Trace solicitado
    let selectedId = 1;

    function renderSidebar() {
      const container = document.getElementById('propList');
      container.innerHTML = properties.map(p => `
        <div class="prop-card ${p.id === selectedId ? 'active' : ''}" onclick="selectProp(${p.id})">
          <img src="${p.img}" class="prop-img">
          <div class="status-pill">${p.status}</div>
          <div class="prop-info">
            <span class="prop-address">${p.address} ${p.type === 'PJ (LLC)' ? '<span class="badge-pj">LLC</span>' : ''}</span>
            <div class="prop-meta">
              <span>🛏️ ${p.beds}bd</span>
              <span>🛁 ${p.baths}ba</span>
              <span>📏 ${p.sqft} sqft</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderContent() {
      const body = document.getElementById('stepContent');
      const prop = properties.find(p => p.id === selectedId);
      
      // Update Wizard Dots
      for(let i=1; i<=5; i++) {
        const dot = document.getElementById('dot'+i);
        dot.className = 'step-dot ' + (i < currentStep ? 'done' : i === currentStep ? 'active' : '');
      }

      document.getElementById('stepInfo').innerText = `PASSO ${currentStep} DE 5`;
      document.getElementById('backBtn').style.display = currentStep === 1 ? 'none' : 'block';

      if(currentStep === 1) {
        body.innerHTML = `<h3>Passo 1: Identificação da Base</h3>
          <p style="color: #64748b; margin-bottom: 20px;">Verificando dados de importação para <b>${prop.address}</b>.</p>
          <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 20px;">
            <img src="${prop.img}" style="width:100%; border-radius: 12px; height: 200px; object-fit: cover;">
            <div>
              <p><b>Lote:</b> PROBATE_ORLANDO_FEV</p>
              <p><b>Data Importação:</b> 12/02/2026</p>
              <div style="background: #eff6ff; padding: 15px; border-radius: 8px; margin-top: 15px;">
                <p style="font-size: 12px;">✅ Nenhuma duplicidade encontrada para este endereço no banco de dados.</p>
              </div>
            </div>
          </div>`;
      } else if (currentStep === 3) {
        body.innerHTML = `<h3>Passo 3: Skip Trace (Contatos)</h3>
          <p style="color: #64748b; margin-bottom: 20px;">Localize os donos e decisores da propriedade <b>${prop.address}</b>.</p>
          
          <div class="import-zone">
            <p style="font-weight: 700; color: var(--accent);">📁 Clique ou arraste o retorno do Skip Trace (.CSV)</p>
            <p style="font-size: 11px; color: #64748b; margin-top: 5px;">Formatos aceitos: PropStream, Batch, BatchSkipTracing</p>
          </div>

          <div class="data-grid">
            <div class="data-card">
              <h4 style="font-size: 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between;">
                TELEFONES ENCONTRADOS <span class="ui-btn" style="font-size: 9px;">+ Add Manual</span>
              </h4>
              <div style="font-size: 13px;">
                <div style="padding: 8px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between;">
                  <span>(407) 555-1212 <span class="source-tag">Mobile</span></span>
                  <span style="color: #64748b; font-size: 10px;">Vendor A</span>
                </div>
                <div style="padding: 8px 0; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between;">
                  <span>(407) 555-9988 <span class="source-tag">Landline</span></span>
                  <span style="color: #64748b; font-size: 10px;">Vendor B</span>
                </div>
              </div>
            </div>
            <div class="data-card">
              <h4 style="font-size: 12px; margin-bottom: 10px;">MAILING / EMAILS</h4>
              <div style="font-size: 13px;">
                <div style="padding: 8px 0; border-bottom: 1px solid #f1f5f9;">
                  <span>sarah.j@email.com</span> <span class="source-tag">Primary</span>
                </div>
                <div style="padding: 8px 0; border-bottom: 1px solid #f1f5f9; color: #64748b;">
                  <span>114 W Celeste St, Orlando, FL</span>
                </div>
              </div>
            </div>
          </div>

          <div class="data-card" style="margin-top: 20px; background: #fffaf0; border-color: #fef3c7;">
            <h4 style="font-size: 12px; color: #92400e;">DECISORES PJ (OFFICERS)</h4>
            <table class="table-ui" style="margin-top: 10px;">
              <thead>
                <tr><th style="font-size: 10px;">Cargo</th><th style="font-size: 10px;">Nome</th><th style="font-size: 10px;">Ação</th></tr>
              </thead>
              <tbody>
                <tr><td>CEO / Manager</td><td>John Doe</td><td><span style="color: var(--accent); cursor: pointer;">Ver Contatos</span></td></tr>
                <tr><td>Registered Agent</td><td>Law Offices of FL</td><td><span style="color: var(--accent); cursor: pointer;">Ver Site</span></td></tr>
              </tbody>
            </table>
          </div>
        `;
      } else {
        body.innerHTML = `<div style="text-align:center; padding-top: 50px;">
          <h3>Passo ${currentStep}</h3>
          <p>Conteúdo em desenvolvimento para o fluxo guiado.</p>
        </div>`;
      }
    }

    function selectProp(id) {
      selectedId = id;
      currentStep = 3; // Focamos no Skip Trace para demonstração
      renderSidebar();
      renderContent();
    }

    function moveStep(delta) {
      currentStep += delta;
      if(currentStep > 5) currentStep = 5;
      if(currentStep < 1) currentStep = 1;
      renderContent();
    }

    // Init
    renderSidebar();
    renderContent();
  </script>
</body>
</html>
