<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow Definitivo - Real Estate Pro</title>
  <style>
    :root {
      --primary: #0f172a;
      --accent: #2563eb;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #ca8a04;
      --bg: #f1f5f9;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--primary); display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar - Cards Visuais */
    .sidebar { width: 360px; background: #fff; border-right: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border); background: #f8fafc; }
    .property-list { flex-grow: 1; overflow-y: auto; padding: 12px; background: #f1f5f9; }
    
    .prop-card { 
      background: #fff; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; 
      cursor: pointer; overflow: hidden; transition: 0.2s; position: relative;
    }
    .prop-card:hover { transform: translateY(-2px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); }
    .prop-card.active { border: 2px solid var(--accent); box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); }
    
    .prop-img { width: 100%; height: 100px; object-fit: cover; background: #cbd5e1; }
    .prop-info { padding: 12px; }
    .prop-address { font-weight: 800; font-size: 13px; display: block; margin-bottom: 4px; }
    .prop-meta { font-size: 11px; color: #64748b; display: flex; gap: 8px; }
    .status-badge { position: absolute; top: 10px; right: 10px; padding: 4px 8px; border-radius: 6px; font-size: 9px; font-weight: 800; background: rgba(0,0,0,0.6); color: #fff; }

    /* Main Area */
    .main { flex-grow: 1; display: flex; flex-direction: column; overflow: hidden; }
    .wizard-nav { background: #fff; padding: 12px; border-bottom: 1px solid var(--border); display: flex; justify-content: center; gap: 8px; }
    .step-dot { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700; color: #94a3b8; padding: 6px 12px; border-radius: 8px; }
    .step-dot.active { background: #eff6ff; color: var(--accent); }
    .step-dot.done { color: var(--success); }

    /* Workspace */
    .workspace { flex-grow: 1; padding: 25px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
    .content-container { width: 100%; max-width: 1000px; background: #fff; border-radius: 16px; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.05); min-height: 600px; display: flex; flex-direction: column; }
    .content-body { padding: 30px; flex-grow: 1; }
    .content-footer { padding: 20px 30px; border-top: 1px solid var(--border); background: #f8fafc; display: flex; justify-content: space-between; align-items: center; border-radius: 0 0 16px 16px; }

    /* UI Elements */
    h3 { font-size: 22px; margin-bottom: 8px; font-weight: 800; }
    .subtitle { color: #64748b; font-size: 14px; margin-bottom: 25px; }
    .table-ui { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
    .table-ui th { text-align: left; padding: 10px; border-bottom: 2px solid #f1f5f9; color: #64748b; }
    .table-ui td { padding: 10px; border-bottom: 1px solid #f1f5f9; }
    
    .btn { padding: 12px 24px; border-radius: 8px; font-weight: 700; cursor: pointer; font-size: 14px; }
    .btn-primary { background: var(--accent); color: #fff; border: none; }
    .btn-outline { background: #fff; border: 1px solid var(--border); }
    .btn-success { background: var(--success); color: #fff; border: none; width: 100%; height: 50px; font-size: 16px; margin-bottom: 10px; }

    /* Comps Analysis (Step 4) */
    .insights-bar { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-bottom: 20px; }
    .insight-card { padding: 12px; background: #f8fafc; border: 1px solid var(--border); border-radius: 10px; }
    .insight-label { font-size: 10px; color: #64748b; text-transform: uppercase; font-weight: 700; }
    .insight-val { font-size: 18px; font-weight: 900; display: block; }

    /* Offer (Step 5) */
    .offer-box { background: #0f172a; color: #fff; padding: 25px; border-radius: 12px; margin-top: 20px; }
    .offer-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; }
    .offer-total { font-size: 28px; font-weight: 900; color: var(--success); border-top: 1px solid #334155; margin-top: 15px; padding-top: 15px; }

    .map-preview { width: 100%; height: 150px; background: #e2e8f0; border-radius: 8px; overflow: hidden; margin-bottom: 15px; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-header">
      <h2 style="font-size: 16px;">Esteira de Aquisição</h2>
      <p style="font-size: 11px; color: #64748b;">Fila: PROBATE_ORLANDO_26</p>
    </div>
    <div class="property-list" id="propList"></div>
  </aside>

  <main class="main">
    <nav class="wizard-nav" id="navSteps">
      <div class="step-dot" id="dot1">1. BASE</div>
      <div class="step-dot" id="dot2">2. ANÁLISE</div>
      <div class="step-dot" id="dot3">3. SKIP TRACE</div>
      <div class="step-dot" id="dot4">4. MERCADO</div>
      <div class="step-dot" id="dot5">5. OFERTA</div>
    </nav>

    <div class="workspace">
      <div class="content-container">
        <div class="content-body" id="stepContent"></div>
        <div class="content-footer">
          <button class="btn btn-outline" onclick="moveStep(-1)" id="backBtn">Voltar</button>
          <div id="stepInfo" style="font-size: 12px; font-weight: 700; color: #64748b;">PASSO 1 DE 5</div>
          <button class="btn btn-primary" onclick="moveStep(1)" id="nextBtn">Próximo Passo →</button>
        </div>
      </div>
    </div>
  </main>

  <script>
    const properties = [
      { id: 1, address: "114 W Celeste St", city: "Orlando", beds: 3, baths: 2, sqft: 1420, year: 1958, avm: 295000, debt: 120000, img: "https://images.unsplash.com/photo-1568605114967-8130f3a36994?w=400" },
      { id: 2, address: "890 Oak Ave", city: "Kissimmee", beds: 4, baths: 3, sqft: 2100, year: 2005, avm: 410000, debt: 350000, img: "https://images.unsplash.com/photo-1570129477492-45c003edd2be?w=400" },
      { id: 3, address: "25217 Mathew St", city: "Apopka", beds: 2, baths: 1, sqft: 980, year: 1940, avm: 180000, debt: 50000, img: "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?w=400" }
    ];

    let currentStep = 1;
    let selectedId = 1;

    function renderSidebar() {
      const container = document.getElementById('propList');
      container.innerHTML = properties.map(p => `
        <div class="prop-card ${p.id === selectedId ? 'active' : ''}" onclick="selectProp(${p.id})">
          <img src="${p.img}" class="prop-img">
          <div class="status-badge">Aguardando</div>
          <div class="prop-info">
            <span class="prop-address">${p.address}</span>
            <div class="prop-meta">
              <span>🛏️ ${p.beds}bd</span>
              <span>🛁 ${p.baths}ba</span>
              <span>📏 ${p.sqft} sqft</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function renderContent() {
      const body = document.getElementById('stepContent');
      const prop = properties.find(p => p.id === selectedId);
      
      for(let i=1; i<=5; i++) {
        const dot = document.getElementById('dot'+i);
        dot.className = 'step-dot ' + (i < currentStep ? 'done' : i === currentStep ? 'active' : '');
      }

      document.getElementById('stepInfo').innerText = `PASSO ${currentStep} DE 5`;
      document.getElementById('backBtn').style.display = currentStep === 1 ? 'none' : 'block';

      if(currentStep === 1) {
        body.innerHTML = `<h3>Passo 1: Identificação da Base</h3>
          <p class="subtitle">Verificação de inventário e duplicidade para <b>${prop.address}</b>.</p>
          <div style="background:#f8fafc; padding:20px; border-radius:12px; border:1px solid #e2e8f0; display:flex; gap:20px;">
            <img src="${prop.img}" style="width:150px; height:100px; border-radius:8px; object-fit:cover;">
            <div>
              <p><b>Lote:</b> PROBATE_ORLANDO_FEV</p>
              <p><b>Ano Construção:</b> ${prop.year}</p>
              <div style="margin-top:10px; color:var(--success); font-weight:700;">✅ Imóvel Único. Nenhuma duplicidade encontrada.</div>
            </div>
          </div>`;
      } else if (currentStep === 2) {
        const equity = prop.avm - prop.debt;
        body.innerHTML = `<h3>Passo 2: Análise de Viabilidade</h3>
          <p class="subtitle">Triagem financeira e física.</p>
          <div style="display:grid; grid-template-columns: 1.2fr 1fr; gap:20px;">
            <div>
              <div class="map-preview"><img src="${prop.img}" style="width:100%; height:100%; object-fit:cover;"></div>
              <p style="font-size:12px;"><b>Ficha Técnica:</b> ${prop.beds}bd, ${prop.baths}ba, ${prop.sqft}sqft.</p>
              <div style="margin-top:10px; background:#eff6ff; padding:10px; border-radius:8px; font-size:12px;">
                <b>Nota:</b> Probate identificado. Sarah Jackson faleceu recentemente.
              </div>
            </div>
            <div style="background:#f8fafc; padding:15px; border-radius:12px; border:1px solid var(--border);">
              <div style="margin-bottom:15px;">
                <p style="font-size:11px; color:#64748b;">POTENTIAL EQUITY</p>
                <p style="font-size:24px; font-weight:900; color:var(--success);">$${equity.toLocaleString()}</p>
              </div>
              <button class="btn btn-success" onclick="moveStep(1)">APROVAR</button>
              <button class="btn btn-outline" style="width:100%; color:var(--danger); border-color:var(--danger);">NEGAR</button>
            </div>
          </div>`;
      } else if (currentStep === 3) {
        body.innerHTML = `<h3>Passo 3: Skip Trace Unificado</h3>
          <p class="subtitle">Localização de contatos e decisores PJ.</p>
          <div style="border:2px dashed var(--border); padding:30px; text-align:center; border-radius:12px; margin-bottom:15px; cursor:pointer; background:#f8fafc;">
            📁 Upload do Retorno de Skip Trace (CSV)
          </div>
          <table class="table-ui">
            <thead><tr><th>Nome</th><th>Tipo</th><th>Contato</th><th>Fonte</th></tr></thead>
            <tbody>
              <tr><td><b>Sarah Jackson</b></td><td>Owner</td><td>(407) 555-0101</td><td>Vendor A</td></tr>
              <tr><td><b>John Doe</b></td><td>LLC Manager</td><td>john@doe.com</td><td>Manual</td></tr>
            </tbody>
          </table>`;
      } else if (currentStep === 4) {
        body.innerHTML = `<h3>Passo 4: Comparativos (Executive Summary)</h3>
          <p class="subtitle">Smart Insights baseados na lógica do CompsAnalysis.tsx.</p>
          <div class="insights-bar">
            <div class="insight-card"><span class="insight-label">Market Heat</span><span class="insight-val" style="color:var(--success);">HOT 🔥</span></div>
            <div class="insight-card"><span class="insight-label">Avg $/sqft</span><span class="insight-val">$204.80</span></div>
            <div class="insight-card"><span class="insight-label">Estimativa AVM</span><span class="insight-val">$291,100</span></div>
          </div>
          <table class="table-ui">
            <thead><tr><th>Endereço Comp</th><th>Preço</th><th>Sqft</th><th>Similarity</th></tr></thead>
            <tbody>
              <tr><td>12 Oak Ave</td><td>$280,000</td><td>1,400</td><td><span style="color:var(--success); font-weight:800;">92%</span></td></tr>
              <tr><td>18 Pine Dr</td><td>$310,000</td><td>1,500</td><td><span style="color:var(--success); font-weight:800;">88%</span></td></tr>
            </tbody>
          </table>`;
      } else if (currentStep === 5) {
        body.innerHTML = `<h3>Passo 5: Proposta e Oferta Final</h3>
          <p class="subtitle">Blindagem de lucro com memória de cálculo.</p>
          <div class="offer-box">
            <div class="offer-row"><span>ARV Estimado (Market)</span><span>$291,100</span></div>
            <div class="offer-row" style="color:#94a3b8;"><span>(-) Reforma Médica ($50/sqft)</span><span>$71,000</span></div>
            <div class="offer-row" style="color:#94a3b8;"><span>(-) Margem Wholesale (8%)</span><span>$23,288</span></div>
            <div class="offer-total">
              <div style="font-size:11px; color:#94a3b8; font-weight:400; margin-bottom:5px;">OFERTA MÁXIMA PARA COMPRA</div>
              $196,812
            </div>
          </div>
          <button class="btn btn-primary" style="width:100%; height:50px; margin-top:20px;">GERAR PDF DA OFERTA</button>`;
      }
    }

    function selectProp(id) { selectedId = id; currentStep = 1; renderSidebar(); renderContent(); }
    function moveStep(delta) { 
      currentStep += delta; 
      if(currentStep > 5) { alert("PDF Gerado com Sucesso!"); currentStep = 5; }
      if(currentStep < 1) currentStep = 1; 
      renderContent(); 
    }

    renderSidebar(); renderContent();
  </script>
</body>
</html>
